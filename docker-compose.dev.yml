# docker-compose.dev.yml — overlay for interactive frontend development
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The frontend service is replaced with a Vite dev server that:
#   - bind-mounts ./frontend/src so edits are reflected instantly (HMR)
#   - proxies /mosaicjson and /relief to the backend (configured in vite.config.js)
#   - exposes port 5173 instead of 5326

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src          # live source edits
      - ./frontend/main.js:/app/main.js
      - ./frontend/style.css:/app/style.css
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - /app/node_modules                # keep container's node_modules isolated
    environment:
      - CHOKIDAR_USEPOLLING=true         # needed on some Linux/WSL setups
    depends_on:
      - backend
    restart: "no"
