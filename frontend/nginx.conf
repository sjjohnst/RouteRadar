server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend API requests to the backend container.
    # The service name "backend" is resolved by Docker's internal DNS.
    location ~ ^/(mosaicjson|cog)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the SPA; fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
