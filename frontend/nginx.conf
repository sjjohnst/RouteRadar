server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy Quebec public land WMS to avoid CORS issues
    location /patp-wms {
        proxy_pass https://servicescarto.mern.gouv.qc.ca/pes/services/Territoire/PATP_prov_WMS/MapServer/WMSServer;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host servicescarto.mern.gouv.qc.ca;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy all backend API requests to the backend container.
    # The service name "backend" is resolved by Docker's internal DNS.
    location ~ ^/(mosaicjson|cog|relief)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the SPA; fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}