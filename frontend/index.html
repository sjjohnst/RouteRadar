<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteRadar</title>
</head>
<!-- <link rel="icon" type="image/png" href="/logo.png"> -->
<body>
    <div id="app">
        <header id="top-nav">
            <div class="brand-and-tabs">
                <span class="brand">RouteRadar</span>
                <button id="nav-layers-tab" class="nav-tab" aria-pressed="true">Layers</button>
                <button id="nav-tools-tab" class="nav-tab" aria-pressed="false">Tools</button>
            </div>
        </header>

        <div id="layout">
            <div id="map-container">
                <div id="map"></div>
                <!-- Relief colorbar overlay -->
                <div id="relief-colorbar" class="relief-colorbar hidden">
                    <span id="relief-colorbar-max" class="colorbar-label">3.0 m</span>
                    <canvas id="relief-colorbar-canvas" width="20" height="160"></canvas>
                    <span id="relief-colorbar-min" class="colorbar-label">0.0 m</span>
                </div>
        <!-- Floating Layers panel (hidden by default) -->
        <div id="layers-panel" class="floating-panel">
            <h2>Layers</h2>
            <div class="control-row">
                <label>
                    <input type="checkbox" id="toggle-quebec-public-land">
                    Public Land
                </label>
                <div class="slider-with-value" style="margin-left: 1em;">
                    <input type="range" id="quebec-public-land-opacity" min="0" max="1" step="0.01" value="0.70">
                        <span id="quebec-public-land-opacity-value" class="value-pill">0.70</span>
                </div>
            </div>
            <div class="control-row" style="margin-top: 0.75em; flex-direction: column; align-items: flex-start; gap: 0.5em;">
                <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                    <label>
                        <input type="checkbox" id="toggle-relief">
                        Relief
                    </label>
                    <div class="slider-with-value">
                        <input type="range" id="relief-opacity" min="0" max="1" step="0.01" value="0.80">
                        <span id="relief-opacity-value" class="value-pill">0.800</span>
                    </div>
                </div>
                <div class="relief-rescale-row" style="display: flex; align-items: center; gap: 0.5em; margin-top: 0.3em;">
                    <div style="margin-left:auto; display: flex; align-items: center; gap: 0.5em;">
                        <label for="relief-vmin" style="font-size: 0.85em;">Min</label>
                        <input type="number" id="relief-vmin" class="relief-bound-input" step="0.1" value="0">
                        <label for="relief-vmax" style="font-size: 0.85em;">Max</label>
                        <input type="number" id="relief-vmax" class="relief-bound-input" step="0.1" value="3">
                        <button id="relief-apply-scale" style="margin-left: 0.5em;">Apply</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Tools panel (hidden by default) -->
        <div id="tools-panel" class="floating-panel hidden" style="top: 13.5em;">
            <h2>Tools</h2>
            <div class="control-row tool-buttons">
                <button id="tool-info" aria-pressed="false">Info</button>
                <button id="tool-marker">Marker</button>
                <button id="tool-measure">Measure</button>
            </div>
            <div id="tool-output" class="tool-output"></div>
            <div id="info-tool-status" class="info-status" style="display:none"></div>
        </div>
            </aside>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
    <script type="module" src="./src/ui/initControls.js"></script>
    <script type="module" src="./src/ui/layersPanel.js"></script>
    <script type="module" src="./src/ui/toolsPanel.js"></script>
</body>
</html>
