<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteRadar</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="app">
        <header id="top-nav">
            <div class="brand-and-tabs">
                <img src="/logo.png" alt="Logo" style="height: 56px; vertical-align: middle; margin-right: 0px;">
                <span class="brand">RouteRadar</span>
                <button id="nav-layers-tab" class="nav-tab" aria-pressed="true">Layers</button>
                <button id="nav-tools-tab" class="nav-tab" aria-pressed="true">Tools</button>
                <button id="nav-help-tab" class="nav-tab" aria-pressed="false">Help</button>
            </div>
            <a href="https://github.com/sjjohnst/RouteRadar" target="_blank" rel="noopener" class="github-link" aria-label="GitHub Repository">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.744.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
            </a>
        </header>

        <div id="help-popup" class="help-popup" style="display:none;">
            <div class="help-popup-content">
                <span id="help-close" class="help-close">&times;</span>
                <h2>Help Guide</h2>
                <div id="help-content"></div>
            </div>
        </div>

        <div id="layout">
            <div id="map-container">
                <div id="map"></div>
                <!-- Relief colorbar overlay -->
                <div id="relief-colorbar" class="relief-colorbar hidden">
                    <span id="relief-colorbar-max" class="colorbar-label">3.0 m</span>
                    <canvas id="relief-colorbar-canvas" width="40" height="220"></canvas>
                    <span id="relief-colorbar-min" class="colorbar-label">0.0 m</span>
                </div>
        <!-- Floating Layers panel (hidden by default) -->
        <div id="layers-panel" class="floating-panel">
            <h2>Layers</h2>
            <div class="control-row">
                <label>
                    <input type="checkbox" id="toggle-quebec-public-land">
                    Public Land
                </label>
                <div class="slider-with-value" style="margin-left: 1em;">
                    <input type="range" id="quebec-public-land-opacity" min="0" max="1" step="0.01" value="0.70">
                        <span id="quebec-public-land-opacity-value" class="value-pill">0.70</span>
                </div>
            </div>
            <div class="control-row" style="margin-top: 0.75em; flex-direction: column; align-items: flex-start; gap: 0.5em;">
                <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                    <label>
                        <input type="checkbox" id="toggle-relief">
                        Height Estimate
                    </label>
                    <div class="slider-with-value">
                        <input type="range" id="relief-opacity" min="0" max="1" step="0.01" value="0.80">
                        <span id="relief-opacity-value" class="value-pill">0.800</span>
                    </div>
                </div>
                <div class="relief-rescale-row" style="display: flex; align-items: center; gap: 0.5em; margin-top: 0.3em;">
                    <div style="margin-left:auto; display: flex; align-items: center; gap: 0.5em;">
                        <label for="relief-vmin" style="font-size: 0.85em;">Min</label>
                        <input type="number" id="relief-vmin" class="relief-bound-input" step="0.1" value="0">
                        <label for="relief-vmax" style="font-size: 0.85em;">Max</label>
                        <input type="number" id="relief-vmax" class="relief-bound-input" step="0.1" value="3">
                        <button id="relief-apply-scale" style="margin-left: 0.5em;">Apply</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Tools panel -->
        <div id="tools-panel" class="floating-panel" style="top: 13.5em;">
            <h2>Tools</h2>
            <div class="control-row tool-buttons">
                <button id="tool-info" aria-pressed="false">Info</button>
                <button id="tool-marker">Marker</button>
                <button id="tool-measure">Measure</button>
            </div>
            <div id="tool-output" class="tool-output"></div>
            <div id="info-tool-status" class="info-status" style="display:none"></div>
        </div>
            </aside>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
        <script>
        // Help popup logic
        const helpTab = document.getElementById('nav-help-tab');
        const helpPopup = document.getElementById('help-popup');
        const helpClose = document.getElementById('help-close');
        helpTab.addEventListener('click', (e) => {
            e.stopPropagation();
            helpPopup.style.display = 'block';
        });
        helpClose.addEventListener('click', () => {
            helpPopup.style.display = 'none';
        });
        window.addEventListener('click', (e) => {
            if (e.target === helpPopup) helpPopup.style.display = 'none';
        });
        </script>
    <script type="module" src="./src/ui/initControls.js"></script>
    <script type="module" src="./src/ui/layersPanel.js"></script>
    <script type="module" src="./src/ui/toolsPanel.js"></script>
</body>
</html>
