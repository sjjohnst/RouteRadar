[project]
name = "routeradar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.68",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pystac-client>=0.9.0",
    "pytest>=9.0.2",
    "rasterio>=1.5.0",
    "rioxarray>=0.22.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: downloads real data from the HRDEM STAC API (deselect with -m 'not integration')",
]
